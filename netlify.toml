# Temporary hosting on Netlify (until Vercel import lock ends)
[build]
  command = "npm run build"
  publish = ".next"

# Official Next.js runtime for Netlify (App Router + API routes)
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"

# SPA-style fallback not needed — Next plugin handles routing
